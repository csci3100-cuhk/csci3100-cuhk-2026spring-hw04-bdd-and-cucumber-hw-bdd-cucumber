name: Autograding Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.8"
          bundler-cache: false

      - name: Install system dependencies
        id: system-dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev libsqlite3-dev

      - name: Decrypt autograder
        id: decrypt-autograder
        env:
          AUTOGRADER_KEY: ${{ secrets.HW04_AUTOGRADER_KEY }}
        run: |
          mkdir -p autograder
          openssl enc -aes-256-cbc -pbkdf2 -d -pass pass:"$AUTOGRADER_KEY" \
            -in .github/secure/autograder.tgz.enc \
            -out /tmp/autograder.tgz
          tar -xzf /tmp/autograder.tgz -C autograder
          rm -f /tmp/autograder.tgz

      - name: Prepare submission
        id: prepare-submission
        run: |
          # Copy into both locations:
          # 1. autograder/submission/features  (for reference)
          # 2. autograder/secure/submission/features  (where run_autograder actually looks)
          mkdir -p autograder/submission/features
          mkdir -p autograder/secure/submission/features
          if [ -d features ]; then
            cp -R features/* autograder/submission/features/
            cp -R features/* autograder/secure/submission/features/
          fi

      - name: Run autograder
        id: run-autograder
        continue-on-error: true
        run: |
          mkdir -p autograder/results
          echo "Debug: autograder/secure contents"
          ls -la autograder/secure
          echo "Debug: autograder/submission contents"
          ls -la autograder/submission
          echo "Debug: autograder/submission/features contents"
          ls -la autograder/submission/features
          cd autograder/secure
          /bin/bash -x ./run_autograder
          echo "Debug: autograder/results contents"
          ls -la ../results

      - name: Prepare grading results
        id: prepare-results
        if: always()
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          results_path = "autograder/results/results.json"
          tests = []
          results_error = ""
          if os.path.exists(results_path):
            with open(results_path) as f:
              data = json.load(f)
            tests = data.get("tests", [])
          else:
            results_error = "Missing results.json"

          test_map = {t.get("name"): t for t in tests}

          expected = [
            ("pass_sort_movies_alphabetically", "EXPECT PASS: sort movies alphabetically"),
            ("pass_sort_movies_release_date", "EXPECT PASS: sort movies in increasing order of release date"),
            ("pass_restrict_pg_r", "EXPECT PASS: restrict to movies with \"PG\" or \"R\" ratings"),
            ("pass_all_ratings", "EXPECT PASS: all ratings selected"),
            ("fail_sort_movies_alphabetically", "EXPECT FAIL: sort movies alphabetically"),
            ("fail_sort_movies_release_date", "EXPECT FAIL: sort movies in increasing order of release date"),
            ("fail_restrict_pg_r", "EXPECT FAIL: restrict to movies with \"PG\" or \"R\" ratings"),
            ("fail_all_ratings", "EXPECT FAIL: all ratings selected"),
          ]

          runners = [e[0] for e in expected]

          def encode_payload(test, fallback_name):
            score = test.get("score", 0) if test else 0
            t_max = test.get("max_score", 0) if test else 0
            status = "pass" if t_max > 0 and score == t_max else "fail"
            message = ""
            if test:
              message = test.get("output", "") or ""
            elif results_error:
              message = results_error
            payload = {
              "version": 1,
              "status": status,
              "max_score": t_max,
              "tests": [
                {
                  "name": test.get("name", fallback_name) if test else fallback_name,
                  "status": status,
                  "score": score,
                  "message": message,
                  "test_code": "",
                  "filename": "",
                  "line_no": 0,
                  "duration": 0
                }
              ]
            }
            return base64.b64encode(json.dumps(payload).encode()).decode()

          for runner, test_name in expected:
            env_key = f"{runner.upper()}_RESULTS"
            test = test_map.get(test_name)
            with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"{env_key}={encode_payload(test, test_name)}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"runners={','.join(runners)}\n")
          PY

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@d13b5912daf5042ac1b71bc38bdb4a6bcd61d8ca
        if: always()
        with:
          runners: ${{ steps.prepare-results.outputs.runners }}

      - name: Generate grade result
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_RUBY_OUTCOME: ${{ steps.setup-ruby.outcome }}
          SYSTEM_DEPENDENCIES_OUTCOME: ${{ steps.system-dependencies.outcome }}
          DECRYPT_OUTCOME: ${{ steps.decrypt-autograder.outcome }}
          PREPARE_SUBMISSION_OUTCOME: ${{ steps.prepare-submission.outcome }}
          RUN_AUTOGRADER_OUTCOME: ${{ steps.run-autograder.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os

          expected_names = [
              "EXPECT PASS: sort movies alphabetically",
              "EXPECT PASS: sort movies in increasing order of release date",
              "EXPECT PASS: restrict to movies with \"PG\" or \"R\" ratings",
              "EXPECT PASS: all ratings selected",
              "EXPECT FAIL: sort movies alphabetically",
              "EXPECT FAIL: sort movies in increasing order of release date",
              "EXPECT FAIL: restrict to movies with \"PG\" or \"R\" ratings",
              "EXPECT FAIL: all ratings selected",
          ]
          results_path = "autograder/results/results.json"
          source_tests = []
          errors = []
          infrastructure = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME"),
              "setup-ruby": os.environ.get("SETUP_RUBY_OUTCOME"),
              "system-dependencies": os.environ.get("SYSTEM_DEPENDENCIES_OUTCOME"),
              "decrypt-autograder": os.environ.get("DECRYPT_OUTCOME"),
              "prepare-submission": os.environ.get("PREPARE_SUBMISSION_OUTCOME"),
              "run-autograder": os.environ.get("RUN_AUTOGRADER_OUTCOME"),
          }
          errors.extend(f"{name}={outcome or 'not_run'}" for name, outcome in infrastructure.items()
                        if outcome != "success")
          if os.path.exists(results_path):
              try:
                  with open(results_path, encoding="utf-8") as source:
                      source_tests = json.load(source).get("tests", [])
              except Exception as exc:
                  errors.append(f"invalid results.json: {exc}")
          else:
              errors.append("missing results.json")

          by_name = {test.get("name"): test for test in source_tests}
          tests = []
          for name in expected_names:
              source = by_name.get(name)
              maximum = source.get("max_score", 0) if source else 0
              score = source.get("score", 0) if source else 0
              if maximum <= 0:
                  errors.append(f"missing maximum for {name}")
              tests.append({
                  "name": name,
                  "score": score,
                  "max_score": maximum,
                  "status": "passed" if maximum > 0 and score == maximum else "failed",
                  "message": (source.get("output", "") or "") if source else "Missing test result",
              })

          result = {
              "schema": "cuhk-csci3100-grade/v1",
              "assignment": "hw04",
              "head_sha": os.environ["HEAD_SHA"],
              "score": sum(test["score"] for test in tests),
              "max_score": 100,
              "tests": tests,
          }
          if sum(test["max_score"] for test in tests) != 100:
              errors.append("test maximums do not sum to the frozen maximum of 100")
          if errors:
              result["status"] = "grading_error"
              result["message"] = "; ".join(errors)
          with open("grade-result.json", "w", encoding="utf-8") as output:
              json.dump(result, output, ensure_ascii=False, indent=2, allow_nan=False)
              output.write("\n")
          PY

      - name: Upload grade result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: csci3100-grade-result
          path: grade-result.json
          if-no-files-found: error
          retention-days: 30
