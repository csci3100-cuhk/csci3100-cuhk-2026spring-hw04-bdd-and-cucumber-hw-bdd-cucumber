name: Autograding Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev libsqlite3-dev

      - name: Decrypt autograder
        env:
          AUTOGRADER_KEY: ${{ secrets.HW04_AUTOGRADER_KEY }}
        run: |
          mkdir -p autograder
          openssl enc -aes-256-cbc -pbkdf2 -d -pass pass:"$AUTOGRADER_KEY" \
            -in .github/secure/autograder.tgz.enc \
            -out /tmp/autograder.tgz
          tar -xzf /tmp/autograder.tgz -C autograder
          rm -f /tmp/autograder.tgz

      - name: Prepare submission
        run: |
          mkdir -p autograder/submission/features
          if [ -d features ]; then
            cp -R features/* autograder/submission/features/
          fi

      - name: Run autograder
        continue-on-error: true
        run: |
          mkdir -p autograder/results
          echo "Debug: autograder/secure contents"
          ls -la autograder/secure
          echo "Debug: autograder/submission contents"
          ls -la autograder/submission
          echo "Debug: autograder/submission/features contents"
          ls -la autograder/submission/features
          cd autograder/secure
          /bin/bash ./run_autograder

      - name: Prepare grading results
        id: prepare-results
        if: always()
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          results_path = "autograder/results/results.json"
          tests = []
          if os.path.exists(results_path):
            with open(results_path) as f:
              data = json.load(f)
            tests = data.get("tests", [])

          runners = []

          def encode_payload(test):
            score = test.get("score", 0)
            t_max = test.get("max_score", 0)
            status = "pass" if score == t_max else "fail"
            payload = {
              "version": 1,
              "status": status,
              "max_score": t_max,
              "tests": [
                {
                  "name": test.get("name", "Unnamed test"),
                  "status": status,
                  "score": score,
                  "message": test.get("output", "") or "",
                  "test_code": "",
                  "filename": "",
                  "line_no": 0,
                  "duration": 0
                }
              ]
            }
            return base64.b64encode(json.dumps(payload).encode()).decode()

          for idx, test in enumerate(tests, start=1):
            runner = f"test_{idx:03d}"
            runners.append(runner)
            env_key = f"{runner.upper()}_RESULTS"
            with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"{env_key}={encode_payload(test)}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            if runners:
              f.write(f"runners={','.join(runners)}\n")
            else:
              f.write("runners=no-tests\n")
          PY

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        if: always()
        env:
          NO-TESTS_RESULTS: eyJ2ZXJzaW9uIjogMSwgInN0YXR1cyI6ICJmYWlsIiwgIm1heF9zY29yZSI6IDAsICJ0ZXN0cyI6IFtdfQ==
        with:
          runners: ${{ steps.prepare-results.outputs.runners }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autograder-results
          path: autograder/results/results.json
